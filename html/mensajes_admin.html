<!DOCTYPE html>
<html lang="es">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="js/bootstrap.bundle.js">
        <title>Panel de Administrador</title>
        <!--Agregar unos estilos bien belicos-->
        <link rel="stylesheet" href="../Estilos/estilos_mensajes.css" />
    
    </head>
<body>

    <!--Barra de navegacion -->
    <div class="container">
        <div class="navigation">
            <ul>
                <li>
                    <a href="admin_panel.html">
                        <span class="icon">
                            <ion-icon name="american-football-outline"></ion-icon></span>
                        <span class="title">Trading Market</span>
                    </a>
                </li>
            </ul>

            <ul>
                <li>
                    <a href="admin_panel.html">
                        <span class="icon">
                            <ion-icon name="home-outline"></ion-icon></span>
                        <span class="title">Principal</span>
                    </a>
                </li>
            </ul>

            <ul>
                <li>
                    <a href="clientes_admin.html">
                        <span class="icon">
                            <ion-icon name="people-outline"></ion-icon></span>
                        <span class="title">Clientes</span>
                    </a>
                </li>
            </ul>

            <ul>
                <li>
                    <a href="mensajes_admin.html">
                        <span class="icon">
                            <ion-icon name="chatbubbles-outline"></ion-icon></span>
                        <span class="title">Mensajes</span>
                    </a>
                </li>
            </ul>

            <ul>
                <li>
                    <a href="#">
                        <span class="icon">
                            <ion-icon name="help-outline"></ion-icon></span>
                        <span class="title">Ayuda</span>
                    </a>
                </li>
            </ul>

            <ul>
                <li>
                    <a href="#">
                        <span class="icon">
                            <ion-icon name="settings-outline"></ion-icon></span>
                        <span class="title">Configuraciones</span>
                    </a>
                </li>
            </ul>

            <ul>
                <li>
                    <a href="#">
                        <span class="icon">
                            <ion-icon name="log-out-outline"></ion-icon>
                        <span class="title">Sign out</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="main">

        <div class="topbar">
            <div class="toggle">
                <ion-icon name="menu-outline"></ion-icon>
            </div>

            <div class="search">
                <label>
                    <input type="text" placeholder="Busca aqui">
                    <ion-icon name="search-outline"></ion-icon>
                </label>
            </div>

            <div class="user">

                <img src="../imagenes/cucu.jpg" alt="" id="profileImage">

            </div>
        </div>
        <!-- Título -->

        <!-- Tabla de Mensajes -->
        <div class="tabla-mensajes">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Mensaje</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Juan Esteban</td>
                        <td>juan.esteban@gmail.com</td>
                        <td>¿Cuál es el estado de mi pedido?</td>
                        <td>
                            <button class="btn-responder" onclick="responderMensaje('Juan Esteban', 'juan.esteban@gmail.com')">Responder</button>
                        </td>
                    </tr>
                    <tr>
                        <td>Daniela Fagua</td>
                        <td>daniela.fagua@yahoo.com</td>
                        <td>Necesito ayuda con el pago.</td>
                        <td>
                            <button class="btn-responder" onclick="responderMensaje('Daniela Fagua', 'daniela.fagua@yahoo.com')">Responder</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Formulario para Responder -->
        <div class="formulario-respuesta">
            <h2>Responder Mensaje</h2>
            <form id="respuesta-form">
                <label for="nombre">Para:</label>
                <input type="text" id="nombre" name="nombre" readonly>
                
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" readonly>
                
                <label for="respuesta">Mensaje:</label>
                <textarea id="respuesta" name="respuesta" rows="5" placeholder="Escribe tu respuesta aquí"></textarea>
                
                <button type="submit" class="btn-enviar">Enviar</button>
            </form>
        </div>
    </div>

    

    <!--Scripts bien gotys-->
    <script src="js/admin.js"></script>
    <!--script para poder usar iconos bien bellaquitos // ionicons-->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
