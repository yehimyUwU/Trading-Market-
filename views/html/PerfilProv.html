<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Trading Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../Estilos/Admins-provedor.css">
    <link rel="stylesheet" href="../Estilos/PerfilProv.css">
</head>
<body>
    <div id="barra-pro"></div>
    
    <section id="content">
        <nav>
            
            <a href="#" class="nav-link">Mi Perfil</a>
            <form action="#">
                <div class="form-input">
                    <input type="search" placeholder="Buscar...">
                    <button type="submit" class="search-btn"><i class='bx bx-search'></i></button>
                </div>
            </form>
            <a href="#" class="notification">
                <i class='bx bxs-bell'></i>
                <span class="num">3</span>
            </a>
        </nav>

        <main class="profile-main">
            <div class="profile-card">
                <div class="profile-header">
                    <img id="profile-avatar" src="http://ssl.gstatic.com/accounts/ui/avatar_2x.png" class="profile-avatar" alt="avatar">
                    <input type="file" class="profile-upload">
                    <h3>Datos del Proveedor</h3>
                </div>

                <div class="profile-stats">
                    <div class="stat-item">
                        <i class='bx bx-package'></i>
                        <span id="pedidos">0 Pedidos</span>
                    </div>
                    <div class="stat-item">
                        <i class='bx bx-check-circle'></i>
                        <span id="entregas">0 Entregas</span>
                    </div>
                </div>

                <form class="profile-form">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="nombre" placeholder="Nombre" disabled>
                    </div>
                    <div class="form-group">
                        <label>Apellidos</label>
                        <input type="text" id="apellidos" placeholder="Apellidos" disabled>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Email" disabled>
                    </div>
                    <div class="form-group">
                        <label>Número de documento</label>
                        <input type="text" id="documento" placeholder="Número de documento" disabled>
                    </div>
                </form>
            </div>
        </main>
    </section>

    <script src="barraprove.js.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch('../php/obtener_perfil.php')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('nombre').value = data.usuario.nombre || 'No disponible';
                        document.getElementById('apellidos').value = data.usuario.apellido || 'No disponible';
                        document.getElementById('email').value = data.usuario.email || 'No disponible';
                        document.getElementById('documento').value = data.usuario.documento || 'No disponible';
                        document.getElementById('profile-avatar').src = data.usuario.imagen || 'http://ssl.gstatic.com/accounts/ui/avatar_2x.png';
                        document.getElementById('pedidos').textContent = `${data.usuario.pedidos || 0} Pedidos`;
                        document.getElementById('entregas').textContent = `${data.usuario.entregas || 0} Entregas`;
                    } else {
                        alert('No se pudo cargar la información del perfil.');
                    }
                })
                .catch(error => {
                    console.error('Error al cargar el perfil:', error);
                    alert('Error al cargar el perfil.');
                });
        });
    </script>
</body>
</html>
