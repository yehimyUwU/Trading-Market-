<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/ionicons@4.2.2/dist/css/ionicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../public/Estilos/longin.css">
    <title>Acceso a Trading Market</title>
</head>
<body>
    <!-- Fondo degradado y botón de regreso -->
    <img src="../../public/imagenes_P/fondito.jpeg" alt="Fondo" id="imagenFondo" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;">
    <a href="../../views/html/index.html" class="btn-regresar">
        <i class="icon ion-md-arrow-back"></i>
        Regresar al inicio
    </a>
    <div class="login-main-card">
        <div class="login-tabs">
            <button id="tabLogin" class="active">Iniciar Sesión</button>
            <button id="tabRegister">Registrarse</button>
        </div>
        <div class="login-content">
            <!-- Login -->
            <form id="loginForm" class="tab-content active" autocomplete="off" action="javascript:void(0);">
                <img src="../../public/imagenes/Logooriginal.png" alt="Logo" class="login-logo">
                <h2>Iniciar Sesión</h2>
                <div class="input-group">
                    <input type="text" id="username" placeholder="Documento" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>
                <div class="input-group">
                    <select id="role" required>
                        <option value="" disabled selected>Seleccione su rol</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Cliente">Cliente</option>
                        <option value="Proveedor">Proveedor</option>
                    </select>
                </div>
                <button type="button" class="btn-main" onclick="verificarLogin()">Iniciar Sesión</button>
                <p id="message" class="msg"></p>
            </form>
            <!-- Registro -->
            <form id="signupForm" class="tab-content" method="POST" action="../../controllers/php/registro.php" autocomplete="off">
                <h2>Registro de Usuario</h2>
                <div class="input-group">
                    <select name="tipo_documento" required>
                        <option value="" disabled selected>Seleccione el tipo de documento</option>
                        <option value="Cédula">Cédula</option>
                        <option value="Tarjeta de Identidad">Tarjeta de Identidad</option>
                        <option value="Pasaporte">Pasaporte</option>
                    </select>
                </div>
                <div class="input-group">
                    <input type="text" name="documento" placeholder="Número de Documento" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
                <div class="input-group">
                    <input type="text" name="nombre" placeholder="Nombre" required>
                </div>
                <div class="input-group">
                    <input type="text" name="apellido" placeholder="Apellido" required>
                </div>
                <div class="input-group">
                    <input type="date" name="fecha_nacimiento" placeholder="Fecha de Nacimiento" required>
                </div>
                <div class="input-group">
                    <select name="genero" required>
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div class="input-group">
                    <input type="email" name="email" placeholder="Correo Electrónico" required>
                </div>
                <div class="input-group">
                    <input type="password" name="password" placeholder="Contraseña" required minlength="7" oninvalid="this.setCustomValidity('La contraseña debe tener al menos 7 caracteres')" oninput="this.setCustomValidity('')">
                </div>
                <div class="input-group">
                    <select name="rol" required id="rolSelect">
                        <option value="" disabled selected>Seleccione su rol</option>
                        <option value="Cliente">Cliente</option>
                        <option value="Proveedor">Proveedor</option>
                    </select>
                </div>
                <button type="submit" class="btn-main">Registrarse</button>
                <p id="signupMessage" class="msg"></p>
            </form>
        </div>
    </div>
    <script src="../../public/js/login.js"></script>
    <script src="https://unpkg.com/ionicons@4.2.2/dist/ionicons.js"></script>
    <script>
        // Tabs para cambiar entre login y registro
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        tabLogin.onclick = function() {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            loginForm.classList.add('active');
            signupForm.classList.remove('active');
        };
        tabRegister.onclick = function() {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            signupForm.classList.add('active');
            loginForm.classList.remove('active');
        };
        // Confirmación para rol proveedor
        document.getElementById('rolSelect').addEventListener('change', function() {
            if (this.value === 'Proveedor') {
                if (!confirm('¿Desea ser proveedor? Se informará a los administradores de su solicitud. Si es aceptado, podrá iniciar sesión como proveedor.')) {
                    this.value = '';
                }
            }
        });
    </script>
</body>
</html>
